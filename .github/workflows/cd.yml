name: CD

on:
  workflow_run:
    workflows: ["CI"] # must match Step 1 ci.yml's `name:` exactly
    types: [completed]
    branches: [master]

permissions:
  contents: read
  id-token: write  # required to request a GitHub OIDC token at all
  packages: write  # required to push to GHCR with the built-in token

concurrency:
  group: cd-${{ github.workflow }}
  cancel-in-progress: false # NEVER cancel a deploy mid-flight — an interrupted terraform apply can leave infrastructure half-applied

jobs:
  build-and-deploy:
    # Only runs if the CI run that triggered this actually passed —
    # ties deployment to CI's real, verified result for this exact
    # commit, not just "a push happened to master."
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The EXACT commit CI validated — not "whatever master
          # currently is," which could have moved since.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Compute immutable image tag
        id: vars
        run: echo "sha_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # no separate PAT needed — this token can push when running inside Actions

      - name: Build and push, tagged with the immutable SHA
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            TORCH_BACKEND=cpu
          tags: ghcr.io/${{ github.repository_owner }}/yolos-detection-api:${{ steps.vars.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Authenticate to Google Cloud — OIDC, zero static keys
        uses: google-github-actions/auth@v3
        with:
          project_id: YOUR_PROJECT_ID
          workload_identity_provider: projects/YOUR_PROJECT_NUMBER/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: [email protected]

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: infra
        run: terraform init

      - name: Terraform apply
        working-directory: infra
        run: |
          terraform apply -auto-approve \
            -var="project_id=ml-project-506908" \
            -var="container_image=ghcr.io/${{ github.repository_owner }}/yolos-detection-api:${{ steps.vars.outputs.sha_tag }}"