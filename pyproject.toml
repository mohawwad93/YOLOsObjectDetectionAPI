[project]
name = "yolos-detection-api"
version = "0.2.0"
description = "FastAPI object-detection service wrapping hustvl/yolos-tiny"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    # fastapi[standard]: pulls in uvicorn[standard] (websockets — required
    # for /ws/detect) and python-multipart (required for File()/
    # UploadFile), version-matched by FastAPI's maintainers against this
    # exact release. Correct as you had it.
    "fastapi[standard]>=0.141.1,<1",

    # transformers and torch as TWO separate direct dependencies — not
    # transformers[torch]. tool.uv.sources' index routing below is only
    # reliably honored for direct dependencies; torch arriving only via
    # an extra risks the CUDA/CPU platform routing being silently
    # ignored during resolution.
    "transformers>=4.49.0,<5",
    "pillow>=12.3.0,<13",
    "pydantic-settings>=2.15.0,<3",
]

[dependency-groups]
test = ["pytest>=9.1.1,<10", "pytest-asyncio>=1.4.0,<2", "httpx>=0.28.1,<1"]
dev = [{ include-group = "test" }, "ruff>=0.16.3,<1", "pre-commit>=4.6.2,<5",]

[project.optional-dependencies]
# Chosen explicitly at sync/build time — not derived from platform,
# because "does this Linux box have a GPU" isn't something sys_platform
# or platform_machine can express.
cpu = ["torch>=2.5,<3"]
gpu = ["torch>=2.5,<3 ; sys_platform == 'linux' and platform_machine == 'x86_64'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",   # native macOS dev — no Docker involved
    "sys_platform == 'linux' and platform_machine == 'x86_64'",   # PRODUCTION — the only platform ever deployed
    "sys_platform == 'linux' and platform_machine == 'aarch64'",  # native Docker builds on Apple Silicon — local dev convenience ONLY
]
exclude-newer = "2026-08-16T00:00:00Z"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "gpu" },
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends",
    "fastapi.Query",
    "fastapi.params.Query",
    "fastapi.File",
    "fastapi.params.File"
]
